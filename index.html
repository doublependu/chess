<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1b1530" />
<meta name="description" content="3D chess in the sky: an AI that adapts to you, pieces that shatter, and checkpoints that rewind time." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>Sky Arena Chess</title>
<style>
:root {
  --bg: #1b1530; --panel: rgba(22, 18, 38, 0.84); --panel-solid: #1d1833; --line: rgba(255, 236, 200, 0.16);
  --text: #f6eedd; --muted: #c9bda6; --gold: #f2c46d; --gold-2: #e09a3a; --danger: #ff6b5b; --ok: #8be0a4;
  --safe-t: env(safe-area-inset-top, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px);
  --radius: 14px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: none;
}
#app { position: fixed; inset: 0; width: 100%; height: 100dvh; overflow: hidden;
  background: linear-gradient(#3b2f6b 0%, #c77b67 55%, #f6c48c 100%); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
a { color: var(--gold); }
[hidden] { display: none !important; }

/* ---------- loading ---------- */
#loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 50;
  background: radial-gradient(120% 90% at 50% 100%, #f3b77c 0%, #b4637a 40%, #3a2d66 75%, #1b1530 100%);
  transition: opacity .5s ease; }
#loading.fade { opacity: 0; pointer-events: none; }
.load-box { text-align: center; padding: 24px; width: min(420px, 86vw); }
.title { font-family: Georgia, "Times New Roman", serif; font-weight: 700; letter-spacing: .02em;
  font-size: clamp(34px, 8vw, 58px); line-height: 1.02; margin: 0 0 6px;
  text-shadow: 0 3px 0 rgba(0,0,0,.25), 0 12px 30px rgba(0,0,0,.35); }
.subtitle { color: var(--muted); margin: 0 0 26px; font-size: 15px; }
.bar { height: 8px; border-radius: 8px; background: rgba(0,0,0,.28); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
.bar > i { display: block; height: 100%; width: 4%; border-radius: 8px;
  background: linear-gradient(90deg, var(--gold-2), var(--gold)); transition: width .25s ease; }
#load-status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 1.2em; }
.knight-spin { font-size: 46px; display: inline-block; animation: hop 1.1s ease-in-out infinite; margin-bottom: 8px; }
@keyframes hop { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) rotate(-6deg) } }

/* ---------- github corner ---------- */
.github-corner { position: absolute; top: 0; right: 0; z-index: 60; }
.github-corner svg { fill: #f2c46d; color: #1b1530; width: 84px; height: 84px; }
.github-corner:hover .octo-arm { animation: octocat-wave 560ms ease-in-out; }
@keyframes octocat-wave { 0%,100% { transform: rotate(0) } 20%,60% { transform: rotate(-25deg) } 40%,80% { transform: rotate(10deg) } }
@media (max-width: 500px) { .github-corner .octo-arm { animation: octocat-wave 560ms ease-in-out; } .github-corner svg { width: 70px; height: 70px; } }

/* ---------- version ---------- */
#version { position: absolute; left: calc(8px + var(--safe-l)); bottom: calc(6px + var(--safe-b)); z-index: 70;
  font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: rgba(255,255,255,.55);
  pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.6); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
.icon-btn { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
  display: grid; place-items: center; font-size: 20px; }
.icon-btn:active { transform: scale(.95); }
#btn-menu { position: absolute; top: calc(10px + var(--safe-t)); left: calc(10px + var(--safe-l)); }
.player { position: absolute; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--line);
  min-width: 150px; max-width: min(360px, 70vw); transition: box-shadow .25s, border-color .25s; }
.player.active { border-color: rgba(242, 196, 109, .8); box-shadow: 0 0 0 2px rgba(242,196,109,.25), 0 6px 24px rgba(0,0,0,.3); }
.player .swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); flex: none; }
.player .swatch.w { background: #f3e9d6; } .player .swatch.b { background: #2c2438; }
.player .name { font-weight: 650; font-size: 15px; white-space: nowrap; }
.player .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.player .caps { font-size: 17px; line-height: 1; letter-spacing: -2px; min-height: 17px; opacity: .9; overflow: hidden; white-space: nowrap; }
.player .col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
#p-ai { top: calc(10px + var(--safe-t)); left: 50%; transform: translateX(-50%); }
#p-you { bottom: calc(12px + var(--safe-b)); left: 50%; transform: translateX(-50%); }
.thinking::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
#hud-actions { position: absolute; right: calc(10px + var(--safe-r)); bottom: calc(12px + var(--safe-b)); display: flex; gap: 8px; }
#hud-actions-top { position: absolute; right: calc(10px + var(--safe-r)); top: calc(10px + var(--safe-t)); display: flex; gap: 8px; }
#banner { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%) scale(.9); padding: 10px 22px; border-radius: 40px;
  background: rgba(150, 30, 40, .82); color: #fff; font-weight: 800; letter-spacing: .08em; font-size: 20px;
  opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none !important; text-transform: uppercase; }
#banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#san-input { position: absolute; left: 50%; bottom: calc(80px + var(--safe-b)); transform: translateX(-50%); width: 160px;
  padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-solid); color: var(--text);
  font: 15px ui-monospace, monospace; text-align: center; user-select: text; -webkit-user-select: text; }
#rewind-fx { position: absolute; inset: 0; pointer-events: none; z-index: 9; opacity: 0; transition: opacity .35s;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(40,20,0,.55) 100%); }
#rewind-fx.on { opacity: 1; }
#rewind-fx .clock { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 54px; opacity: .85;
  animation: spinback 1s linear infinite; filter: drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
@keyframes spinback { to { transform: translateY(-50%) rotate(-360deg); } }
#rewind-fx .label { position: absolute; left: 50%; top: calc(64px + var(--safe-t)); transform: translateX(-50%);
  font-weight: 800; letter-spacing: .3em; color: #ffe2a8; text-shadow: 0 2px 10px rgba(0,0,0,.7); font-size: 15px; }

/* landscape: player cards on the left */
@media (orientation: landscape) and (max-height: 640px), (min-aspect-ratio: 13/10) {
  #p-ai { top: calc(66px + var(--safe-t)); left: calc(10px + var(--safe-l)); transform: none; }
  #p-you { bottom: auto; top: calc(66px + 74px + var(--safe-t)); left: calc(10px + var(--safe-l)); transform: none; }
}

/* ---------- overlays / menus ---------- */
.overlay { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px;
  background: rgba(14, 10, 26, .52); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); animation: fadein .2s ease; }
.overlay.clear { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
@keyframes fadein { from { opacity: 0 } }
.panel { width: min(420px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: var(--panel-solid);
  border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.45);
  touch-action: pan-y; }
.panel h2 { margin: 0 0 4px; font-family: Georgia, serif; font-size: 26px; }
.panel p.lead { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.menu { display: grid; gap: 10px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(255,255,255,.06); font-weight: 600; font-size: 15px; }
.btn:hover { background: rgba(255,255,255,.1); }
.btn:active { transform: scale(.98); }
.btn.primary { background: linear-gradient(180deg, var(--gold), var(--gold-2)); color: #2a1a05; border-color: transparent; }
.btn.danger { color: #ffc2bb; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.row { display: flex; gap: 10px; } .row > * { flex: 1; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; min-height: 40px; border: 0; background: transparent; font-size: 14px; padding: 6px 4px; }
.seg button.on { background: rgba(242,196,109,.22); color: var(--gold); font-weight: 700; }
.setting { margin: 14px 0; } .setting label.h { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.slots { display: grid; gap: 10px; }
.slot { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(255,255,255,.04); text-align: left; width: 100%; }
.slot img, .slot .thumb { width: 96px; height: 72px; border-radius: 8px; object-fit: cover; background: #0e0b18; flex: none; }
.slot .meta { font-size: 13px; color: var(--muted); } .slot .label { font-weight: 650; }
.slot[disabled] { opacity: .45; }
.fineprint { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
.menu .hint { margin: -6px 0 2px; font-size: 12px; color: var(--muted); text-align: center; }
.result-big { font-size: 40px; margin: 6px 0; }
#toast { position: absolute; left: 50%; bottom: calc(90px + var(--safe-b)); transform: translateX(-50%); z-index: 80;
  display: grid; gap: 6px; pointer-events: none; width: min(92vw, 420px); }
#toast div { background: rgba(20,16,34,.92); border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px; font-size: 14px;
  text-align: center; animation: fadein .2s ease; }
.promo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.promo button { font-size: 40px; min-height: 72px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.06); }
.kbd { font: 12px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-radius: 5px; }
.unsupported { max-width: 420px; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" tabindex="0" aria-label="Chess board"></canvas>
  <div id="rewind-fx"><div class="label">REWINDING TIME</div><div class="clock">⟲</div></div>
  <div id="hud" hidden>
    <button id="btn-menu" class="icon-btn" aria-label="Pause menu" title="Pause (Esc)">☰</button>
    <div id="hud-actions-top">
      <button id="btn-save" class="icon-btn" aria-label="Save checkpoint" title="Save checkpoint">💾</button>
      <button id="btn-load" class="icon-btn" aria-label="Load checkpoint" title="Load checkpoint">⏪</button>
    </div>
    <div class="player" id="p-ai"><span class="swatch b"></span><div class="col"><span class="name">AI</span><span class="sub" id="ai-status">Adaptive</span></div><div class="caps" id="caps-ai"></div></div>
    <div class="player" id="p-you"><span class="swatch w"></span><div class="col"><span class="name">You</span><span class="sub" id="you-status">Your move</span></div><div class="caps" id="caps-you"></div></div>
    <div id="hud-actions">
      <button id="btn-people" class="icon-btn" aria-label="Play with friends" title="Play with friends">👥</button>
      <button id="btn-view" class="icon-btn" aria-label="Reset view" title="Reset view">⌖</button>
    </div>
    <div id="banner">Check</div>
    <input id="san-input" hidden placeholder="e.g. Nf3" aria-label="Type a move" autocomplete="off" autocapitalize="off" spellcheck="false" />
  </div>
  <div id="overlay-root"></div>
  <div id="toast" aria-live="polite"></div>
  <div id="version">%APP_VERSION%</div>
  <div id="loading">
    <a href="https://github.com/doublependu/chess" class="github-corner" aria-label="Fork me on GitHub" title="Fork me on GitHub" target="_blank" rel="noopener"><svg viewBox="0 0 250 250" aria-hidden="true"><path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path><path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path><path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path></svg></a>
    <div class="load-box">
      <div class="knight-spin" aria-hidden="true">♞</div>
      <h1 class="title">Sky Arena<br />Chess</h1>
      <p class="subtitle">Pieces shatter. Time rewinds. The AI learns your level.</p>
      <div class="bar"><i id="load-bar"></i></div>
      <div id="load-status">Loading…</div>
      <p class="fineprint"><a href="https://github.com/doublependu/chess" target="_blank" rel="noopener">Fork me on GitHub</a> · GPL-3.0 · <a href="https://maize.live" target="_blank" rel="noopener">More games on Maize.Live</a></p>
    </div>
  </div>
</div>
<script>
  // Block browser zoom gestures that the player could get stuck in (iOS ignores user-scalable=no).
  (function () {
    var opts = { passive: false };
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
      document.addEventListener(t, function (e) { e.preventDefault(); }, opts);
    });
    document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, opts);
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, opts);
    document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, opts);
    window.__t0 = performance.now();
  })();
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
